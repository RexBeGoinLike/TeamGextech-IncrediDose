<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Manage Prescription Items</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>

	<!-- Navigation -->
	<nav>
		<div id="logo-container">
			<img src="res/logo-image.png">
			<img src="res/logo-text.png">
		</div>
	</nav>

	<!--  Operations  -->
	<div id="operation-container">
		<button id="back">Back</button>
		<input type="text" name="search" placeholder="Search Medicine">
		<button id="Add">Add</button>
	</div>

	<!--  Search Results Container  -->
	<article id="searchresults-container">
		<div class="card" id="header">
			<span>Name</span>
			<span>Brand</span>
			<span>Quantity</span>
			<span>Dosage</span>
			<span>Action</span>
		</div>

		<div class="card searchresult">

		</div>
	</article>

	<!-- Manage Button (Keep Hidden)-->
	<div>		
		<button>View More</button>
		<button>Edit</button>
		<button>Delete</button>
	</div>

</body>
</html>
