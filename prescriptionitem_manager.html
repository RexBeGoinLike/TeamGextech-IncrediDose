<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta ManagePrescriptionItems="viewport" content="width=device-width, initial-scale=1">
	<title>Home</title>
	<script src="script/prescriptionitem_manager.js" defer></script>
</head>
<body>

	<!-- Navigation -->
	<nav>
		<div id="logo-container">
			<img src="res/logo-image.png">
			<img src="res/logo-text.png">
		</div>
	</nav>

	<!--  Operations  -->
	<div id="operation-container">
		<input type="text" name="search" placeholder="Search Patient">
		<button id="add">Add</button>
	</div>

	<!--  Search Results Container  -->
	<article id="searchresults-container">
		<div class="card" id="header">
			<span>Name</span>
			<span>Brand</span>
			<span>Quantity</span>
			<span>Dosage</span>
			<span>Action</span>
		</div>

		<div class="card searchresult" data-label="Medicine Details">
			<span class="medicine-name">Ibuprofen</span>
			<span class="brand-name">Alaxan® FR</span>
			<span class="quantity">10(20)</span>
			<span class="dosage">400mg</span>
			<span><button class="action-btn">⋮</button></span>
		</div>

		<div class="card searchresult" data-label="Medicine Details">
			<span class="medicine-name">Acetaminophen</span>
			<span class="generic">Generic</span>
			<span class="quantity">10(10)</span>
			<span class="dosage">400mg</span>
			<span><button class="action-btn">⋮</button></span>
		</div>

		<div class="card searchresult" data-label="Medicine Details">
			<span class="medicine-name">Fentanyl</span>
			<span class="brand-name">Actiq® FR</span>
			<span class="quantity">0(2)</span>
			<span class="dosage">15mg</span>
			<span><button class="action-btn">⋮</button></span>
		</div>

	</article>

	<!-- Manage Button (Keep Hidden)-->
	<div id="manage-container">
		<button target="prescription_manager.html">Manage Prescription</button>
	</div>
</body>
</html>
