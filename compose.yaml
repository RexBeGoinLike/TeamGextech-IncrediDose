services:
  nodejs-service:
    build:
      context: .
      dockerfile: Dockerfile.nodejs
    container_name: nodejs-app
    ports:
      - "3000:3000"
    volumes:
      - ./node:/usr/src/app/node
      - ./package.json:/usr/src/app/package.json
    depends_on:
      - mysql-db
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=mydatabase

  apache-service:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: php-apache
    ports:
      - "8080:80"
    volumes:
      - ./includes:/var/www/html
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_ROOT_HOST: "%" 
      MYSQL_DATABASE: mydatabase
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
